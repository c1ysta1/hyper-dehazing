<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阶段2 PSGNet 基线 实时进度</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
         background: #0f172a; color: #e2e8f0; padding: 24px; }
  .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 16px;
          border: 1px solid #334155; }
  h1 { font-size: 20px; margin-bottom: 4px; color: #f1f5f9; }
  .sub { color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
  .stat-grid { display: flex; gap: 16px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 130px; background: #0f172a; border-radius: 10px; padding: 14px 16px;
          border: 1px solid #334155; }
  .stat .label { font-size: 12px; color: #94a3b8; }
  .stat .value { font-size: 25px; font-weight: 700; margin-top: 4px; }
  .stat .value.green { color: #4ade80; }
  .stat .value.blue { color: #60a5fa; }
  .stat .value.amber { color: #fbbf24; }
  .bar-wrap { margin-top: 12px; background: #0f172a; border-radius: 8px; height: 18px; overflow: hidden;
              border: 1px solid #334155; }
  .bar { height: 100%; background: linear-gradient(90deg, #10b981, #3b82f6, #8b5cf6); width: 0%;
         transition: width 0.5s; }
  .pct-row { display:flex; justify-content:space-between; font-size:12px; color:#94a3b8; margin-bottom:4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid #334155; }
  th { color: #94a3b8; font-weight: 500; }
  td:first-child, th:first-child { text-align: left; }
  tr:hover td { background: #1e293b; }
  .log-box { font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; font-size: 12px;
             background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px;
             max-height: 220px; overflow-y: auto; white-space: pre-wrap; }
  .status { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px;
            font-size: 13px; font-weight: 600; }
  .status.running { background: #16a34a22; color: #4ade80; border: 1px solid #16a34a55; }
  .status.done { background: #3b82f622; color: #60a5fa; border: 1px solid #3b82f655; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  svg { width: 100%; height: 240px; }
  #chart-title { font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
  .back-link { color: #60a5fa; font-size: 13px; text-decoration: none; }
  .back-link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <a class="back-link" href="/"><- 返回多阶段总览</a>
    <h1 style="margin-top:8px;">阶段2 · PSGNet 物理引导基线（全监督）</h1>
    <div class="sub">数据集: RSyntHyperPDID · 训练: data/train · 测试: data/test · 监督损失(L1 + 物理先验) · 作为去雾性能上界参考</div>
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:14px;">
      <span class="status running" id="status"><span class="dot"></span>训练中</span>
      <span class="sub" id="last-update" style="margin:0;">最后更新: --</span>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="label">Epoch</div><div class="value blue" id="epoch">-- / --</div></div>
      <div class="stat"><div class="label">Train Loss</div><div class="value" id="train-loss">--</div></div>
      <div class="stat"><div class="label">Test Loss</div><div class="value" id="test-loss">--</div></div>
      <div class="stat"><div class="label">Test PSNR (最新)</div><div class="value" id="test-psnr">--</div></div>
      <div class="stat"><div class="label">Test PSNR (最优)</div><div class="value green" id="best-psnr">--</div></div>
    </div>
    <div style="margin-top:14px;">
      <div class="pct-row"><span>训练进度</span><span id="pct">0%</span></div>
      <div class="bar-wrap"><div class="bar" id="bar"></div></div>
    </div>
  </div>

  <div class="card">
    <div id="chart-title">训练/测试损失 + 测试 PSNR 曲线</div>
    <svg id="chart" viewBox="0 0 800 240" preserveAspectRatio="none">
      <text x="30" y="50" fill="#94a3b8" font-size="13">等待日志……</text>
    </svg>
  </div>

  <div class="card">
    <h1 style="font-size:16px;">Epoch 明细（最新 30 条）</h1>
    <div style="max-height:320px; overflow-y:auto;"><table id="table"></table></div>
  </div>

  <div class="card">
    <h1 style="font-size:16px;">原始日志（尾部）</h1>
    <div class="log-box" id="raw-log"></div>
  </div>

<script>
  // 动态定位当前阶段2训练日志：从 /api/status 取最新 log 路径，避免硬编码 run 名
  let LOG_URL = '/logs/psgnet_phase2_0821_1523/train_log.txt';

  async function locateLog() {
    try {
      const st = await (await fetch('/api/status?t=' + Date.now())).json();
      const p2 = st.phases && st.phases.phase2;
      if (p2 && p2.log && p2.log.indexOf('train_log.txt') >= 0) {
        LOG_URL = p2.log;
      }
    } catch (e) { /* 保持默认 */ }
  }

  function parseEpoch(line) {
    const m = line.match(/Epoch \[(\d+)\/(\d+)\]/);
    if (!m) return null;
    const r = { ep: +m[1], total: +m[2] };
    const tl = line.match(/train_loss=([\d.]+)/);
    const vl = line.match(/test_loss=([\d.]+)/);
    const ps = line.match(/test_psnr=([\d.]+)/);
    r.tl = tl ? +tl[1] : null;
    r.vl = vl ? +vl[1] : null;
    r.psnr = ps ? +ps[1] : null;
    return r;
  }

  async function refresh() {
    try {
      await locateLog();
      const res = await fetch(LOG_URL + '?t=' + Date.now());
      const text = await res.text();
      const rows = [];
      for (const line of text.split('\n')) {
        const r = parseEpoch(line);
        if (r) rows.push(r);
      }
      if (!rows.length) return;
      const cur = rows[rows.length - 1];
      const best = rows.reduce((a, b) => (b.psnr != null && (a == null || b.psnr > a)) ? b.psnr : a, null);
      document.getElementById('epoch').textContent = cur.ep + ' / ' + cur.total;
      document.getElementById('train-loss').textContent = cur.tl != null ? cur.tl.toFixed(4) : '--';
      document.getElementById('test-loss').textContent = cur.vl != null ? cur.vl.toFixed(4) : '--';
      document.getElementById('test-psnr').textContent = cur.psnr != null ? cur.psnr.toFixed(2) + ' dB' : '--';
      document.getElementById('best-psnr').textContent = best != null ? best.toFixed(2) + ' dB' : '--';
      const pct = Math.min(100, Math.round(cur.ep / cur.total * 100));
      document.getElementById('pct').textContent = pct + '%';
      document.getElementById('bar').style.width = pct + '%';
      document.getElementById('last-update').textContent = '最后更新: ' + new Date().toLocaleTimeString('zh-CN');
      if (cur.ep >= cur.total) {
        const s = document.getElementById('status');
        s.className = 'status done';
        s.innerHTML = '训练完成';
      }
      renderChart(rows);
      renderTable(rows);
      const lines = text.split('\n').filter(l => l.trim());
      document.getElementById('raw-log').textContent = lines.slice(-25).join('\n');
    } catch (e) {
      document.getElementById('status').textContent = '连接失败，重试中...';
    }
  }

  function renderChart(rows) {
    const svg = document.getElementById('chart');
    const W = 800, H = 240, padL = 50, padR = 55, padT = 14, padB = 25;
    const lossVals = rows.map(r => (r.tl != null ? r.tl : (r.vl != null ? r.vl : 0)));
    let mn = Math.min(...lossVals), mx = Math.max(...lossVals);
    const pad = Math.max(0.0005, (mx - mn) * 0.1);
    mn -= pad; mx += pad;
    const x = i => padL + (W - padL - padR) * (i / Math.max(1, rows.length - 1));
    const y = v => padT + (H - padT - padB) * (1 - (v - mn) / (mx - mn));
    let html = '';
    for (let g = 0; g <= 4; g++) {
      const v = mn + (mx - mn) * g / 4;
      html += `<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="#334155" stroke-width="1"/>`;
      html += `<text x="${padL-6}" y="${y(v)+4}" fill="#94a3b8" font-size="11" text-anchor="end">${v.toFixed(3)}</text>`;
    }
    html += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#475569" stroke-width="1.5"/>`;
    html += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#475569" stroke-width="1.5"/>`;
    if (rows.length > 1) {
      const line = (key, color, dash) => {
        const pts = rows.map((r, i) => r[key] != null ? `${x(i).toFixed(1)},${y(r[key]).toFixed(1)}` : null)
                       .filter(Boolean).join(' ');
        if (pts) html += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" ${dash ? 'stroke-dasharray="6,4"' : ''} stroke-linejoin="round"/>`;
      };
      line('tl', '#4ade80', false);
      line('vl', '#60a5fa', false);
    }
    const psnrs = rows.filter(r => r.psnr != null);
    if (psnrs.length > 1) {
      let pmn = Math.min(...psnrs.map(r => r.psnr)), pmx = Math.max(...psnrs.map(r => r.psnr));
      const ppad = Math.max(0.5, (pmx - pmn) * 0.25);
      pmn -= ppad; pmx += ppad;
      const py = v => padT + (H - padT - padB) * (1 - (v - pmn) / (pmx - pmn));
      const ppts = psnrs.map(r => `${x(rows.indexOf(r)).toFixed(1)},${py(r.psnr).toFixed(1)}`).join(' ');
      html += `<polyline points="${ppts}" fill="none" stroke="#f472b6" stroke-width="2.2" stroke-dasharray="6,4" stroke-linejoin="round"/>`;
      html += `<text x="${W-padR+6}" y="${py(pmx)+4}" fill="#f472b6" font-size="11">${pmx.toFixed(1)}</text>`;
      html += `<text x="${W-padR+6}" y="${py(pmn)+4}" fill="#f472b6" font-size="11">${pmn.toFixed(1)}</text>`;
    }
    svg.innerHTML = html;
  }

  function renderTable(rows) {
    const reversed = [...rows].reverse().slice(0, 30);
    let html = '<table><tr><th>Epoch</th><th>Train Loss</th><th>Test Loss</th><th>Test PSNR (dB)</th></tr>';
    for (const r of reversed) {
      const hl = r.psnr != null ? ' style="color:#4ade80;"' : '';
      html += `<tr><td>${r.ep}</td><td>${r.tl!=null?r.tl.toFixed(4):'--'}</td>` +
              `<td>${r.vl!=null?r.vl.toFixed(4):'--'}</td>` +
              `<td${hl}>${r.psnr!=null?r.psnr.toFixed(2):'--'}</td></tr>`;
    }
    document.getElementById('table').innerHTML = html + '</table>';
  }

  refresh();
  setInterval(refresh, 4000);
</script>
</body>
</html>
